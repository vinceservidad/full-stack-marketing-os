name: Creative repair verification (temporary)

on:
  push:
    branches: [fix/creative-sales-argument-20260913]

permissions:
  contents: write

concurrency:
  group: creative-sales-argument-repair
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'vinceservidad/full-stack-marketing-os' && github.ref == 'refs/heads/fix/creative-sales-argument-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild generated knowledge
        run: python3 scripts/build-gpt-knowledge.py
      - name: Save only generated exports to the repair branch
        run: |
          set -euo pipefail
          git add -- gpt-knowledge/pack
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Regenerate knowledge exports from creative repair sources'
            git push origin HEAD:refs/heads/fix/creative-sales-argument-20260913
          fi
          git rev-parse HEAD
      - name: Verify source and tooling
        run: |
          set -euo pipefail
          scripts/validate-skill-architecture.sh .
          scripts/validate-terminology.sh .
          scripts/validate-platform-currency.sh .
          scripts/validate-knowledge-taxonomy.sh .
          scripts/validate-scaling-system.sh .
          python3 scripts/check-platform-freshness.py .
          python3 scripts/eval.py --static
          python3 scripts/build-gpt-knowledge.py --check
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/check-markdown-links.py
          bash scripts/validate-agent-distribution.sh .
      - name: Package tracked source for offline inspection
        if: always()
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creative-repair-source
          path: |
            ${{ runner.temp }}/source.tar.gz
            ${{ runner.temp }}/source-commit.txt
          retention-days: 1
