name: Rebuild GPT pack once

on:
  push:
    branches:
      - feat/marketing-decision-lifecycle

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/marketing-decision-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild generated knowledge pack
        run: python3 scripts/build-gpt-knowledge.py
      - name: Commit generated pack if changed
        run: |
          if git diff --quiet -- gpt-knowledge/pack; then
            echo 'GPT pack already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gpt-knowledge/pack
          git commit -m 'Rebuild GPT knowledge pack'
          git push origin HEAD:feat/marketing-decision-lifecycle
